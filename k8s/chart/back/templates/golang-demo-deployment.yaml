apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.36.0 (HEAD)
  labels:
    io.kompose.service: {{ .Values.backend.deployment.label | default "golang-demo" }}
  name: {{ include "chart.fullname" . }}-golang-demo
spec:
  replicas: {{ .Values.backend.deployment.replicas | default 10 }}
  selector:
    matchLabels:
      io.kompose.service: {{ .Values.backend.deployment.label | default "golang-demo" }}
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.36.0 (HEAD)
      labels:
        io.kompose.service: {{ .Values.backend.deployment.label | default "golang-demo" }}
    spec:
      containers:
        - env:
            - name: DB_ENDPOINT
              value: my-app-backend-postgresql.default.svc.cluster.local
            - name: DB_NAME
              value:  {{ .Values.postgresql.auth.database }}
            - name: DB_PASS
              value: {{ .Values.postgresql.auth.postgresPassword }}
            - name: DB_PASSWORD
              value: {{ .Values.postgresql.auth.password }}
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: {{ .Values.postgresql.auth.username }}
            - name: DEBUG
              value: "true"
            - name: PORT
              value: "8080"
            - name: REDIS_ENDPOINT
              value: my-app-backend-redis-master.default.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
          image: {{ .Values.backend.deployment.image }}:{{ .Values.backend.deployment.tag }}
          name: {{ .Values.backend.deployment.container.name | default "golang-demo" }}
          ports:
            - containerPort: {{ .Values.backend.deployment.container.port | default 5678 }}
              protocol: TCP
      restartPolicy: Always