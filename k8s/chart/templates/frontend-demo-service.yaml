apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.36.0 (HEAD)
  labels:
    io.kompose.service: {{ .Values.frontend.service.label | default "frontend-demo" }}
    name: {{ .Values.frontend.service.name | default (include "chart.fullname" .) }}-frontend-demo-svc
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.frontend.service.port | default 80 }}
      targetPort: {{ .Values.frontend.service.targetPort | default 80 }}
  selector:
    io.kompose.service: {{ .Values.frontend.deployment.label | default "frontend-demo" }}