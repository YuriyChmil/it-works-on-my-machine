apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.service.name | default (include "chart.fullname" .) }}-golang-demo-svc
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.36.0 (HEAD)
  labels:
    io.kompose.service: {{ .Values.backend.service.label | default "golang-demo" }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port | default 8080 }}
      targetPort: {{ .Values.backend.service.targetPort | default 8080 }}
  selector:
    io.kompose.service: {{ .Values.backend.deployment.label | default "backend-demo" }}