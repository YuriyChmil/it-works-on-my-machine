apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YuriyChmil/it-works-on-my-machine.git
    targetRevision: feature/add-CI
    path: k8s/chart/back
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true