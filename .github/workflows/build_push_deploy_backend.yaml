---
name: build-push-deploy-prod
#act --container-architecture linux/amd64 --secret-file my.secrets -W '.github/workflows/build_push_deploy_backend.yaml' -P ubuntu-22.04=catthehacker/ubuntu:act-latest
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '.frontend/**'

jobs:
  build-push:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup docker context for buildx
        id: buildx-context
        run: |
          docker context create builders

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          endpoint: builders

      - name: Log in to Docker Hub and push image
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_USER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          target: prod
          push: true
          tags: yuriichml1/back:${{ github.sha }}
          context: backend
  deploy:
    runs-on: ubuntu-22.04
    needs:
      - build-push
    steps:
      - name: Update Helm values file
        run: |
          sed -i "s|tag:.*|tag: ${{ github.sha }}|" chart/back/values.yaml
      - name: Commit changes
        uses: EndBug/add-and-commit@v9.1.4
        with:
          author_name: GitHub Actions
          author_email: cicd@test.com
          message: "Updated to commit ${{ github.sha }}"

